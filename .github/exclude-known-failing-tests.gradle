// Gradle init script: known failing or flaky upstream tests, left out of the fork's full unit suite.
// Used by the release gate (.github/workflows/live-sync-release.yml) and locally by tools/full-suite.sh.
// Exclude a method rather than its class where possible, so the class's healthy tests still run.
// Review monthly instead of letting the list grow.
allprojects {
    tasks.withType(Test).configureEach {
        filter {
            // Both tests need Trakt credentials in local.properties.
            excludeTestsMatching '*.TraktAuthServiceTest'
            // Upstream streaming-cache concurrency test: random and threaded, flaky under load.
            excludeTestsMatching '*.ParallelRangeChunkLeaseTest'
            // Fails on upstream dev: a title stays in the strip after the field is cleared.
            excludeTestsMatching '*.SearchViewModelSuggestionsTest.clearing the field retires the suggestions and the submitted query'
            // Builds its dates from the wall clock in the system zone: fails in the evening (after 18:00 Central).
            excludeTestsMatching '*.ContinueWatchingAiringRulesTest.watchableEpisodes excludes future mid-season episodes so checkmark can apply'
            // A benchmark that only prints and never asserts (about 1.2 s).
            excludeTestsMatching '*.NuvioExoPlayerPerformanceHelperTest.benchmark*'
        }
    }
}
